<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Water Usage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Add Water Usage
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input
                    type="text"
                    name="location"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Usage Date</label>
                <input
                    type="date"
                    name="usage_date"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Liters Used</label>
                <input
                    type="number"
                    name="liters_used"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Purpose</label>

                <select
                    name="purpose"
                    class="form-select">

                    <option>Drinking</option>
                    <option>Cooking</option>
                    <option>Bathing</option>
                    <option>Cleaning</option>
                    <option>Gardening</option>

                </select>

            </div>

            <button class="btn btn-primary w-100">
                Save Record
            </button>

            <a href="/" class="btn btn-secondary w-100 mt-2">
                Back Home
            </a>

        </form>

    </div>

</div>

</body>
</html>
