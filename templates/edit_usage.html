<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Water Usage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">Edit Water Usage</h2>

<form method="POST">

<div class="mb-3">
<label>Username</label>
<input type="text" class="form-control"
name="username"
value="{{ record.username }}" required>
</div>

<div class="mb-3">
<label>Location</label>
<input type="text" class="form-control"
name="location"
value="{{ record.location }}" required>
</div>

<div class="mb-3">
<label>Usage Date</label>
<input type="date"
class="form-control"
name="usage_date"
value="{{ record.usage_date }}" required>
</div>

<div class="mb-3">
<label>Liters Used</label>
<input type="number"
class="form-control"
name="liters_used"
value="{{ record.liters_used }}" required>
</div>

<div class="mb-3">
<label>Purpose</label>

<select class="form-select" name="purpose">

<option {% if record.purpose=="Drinking" %}selected{% endif %}>Drinking</option>
<option {% if record.purpose=="Cooking" %}selected{% endif %}>Cooking</option>
<option {% if record.purpose=="Bathing" %}selected{% endif %}>Bathing</option>
<option {% if record.purpose=="Cleaning" %}selected{% endif %}>Cleaning</option>
<option {% if record.purpose=="Gardening" %}selected{% endif %}>Gardening</option>

</select>

</div>

<button class="btn btn-success w-100">
Update Record
</button>

<a href="/view" class="btn btn-secondary w-100 mt-2">
Cancel
</a>

</form>

</div>

</div>

</body>
</html>
