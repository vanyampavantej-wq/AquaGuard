<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Water Usage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Water Usage Records</h2>
    <form method="GET" action="/view" class="row mb-3">

    <div class="col-md-10">

        <input
        type="text"
        class="form-control"
        name="search"
        placeholder="Search by Username, Location or Purpose"
        value="{{ search }}">

    </div>

    <div class="col-md-1">

    <button class="btn btn-primary w-100">
        Search
    </button>

</div>

<div class="col-md-1">

    <a href="/view" class="btn btn-secondary w-100">
        Reset
    </a>

</div>

</form>
    <div class="mb-3">

    <a href="/add" class="btn btn-primary">
        + Add New Record
    </a>

    <a href="/export" class="btn btn-success">
        Export CSV
    </a>

    <a href="/export_pdf" class="btn btn-danger">
        Download PDF
    </a>

</div>
    <a href="/view" class="btn btn-secondary mb-3">
    Reset
    </a>
    <form action="/view" method="GET" class="row g-2 mb-3">

    <div class="col-md-5">
        <label class="form-label">From Date</label>
        <input
            type="date"
            class="form-control"
            name="from_date"
            value="{{ from_date if from_date else '' }}">
    </div>

    <div class="col-md-5">
        <label class="form-label">To Date</label>
        <input
            type="date"
            class="form-control"
            name="to_date"
            value="{{ to_date if to_date else '' }}">
    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" type="submit">
            Filter
        </button>
    </div>

</form>
    <table class="table table-bordered table-striped table-hover">
        

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Location</th>
                <th>Date</th>
                <th>Liters</th>
                <th>Purpose</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

       {% for row in data %}

        <tr>

            <td>{{ row.id }}</td>
            <td>{{ row.username }}</td>
            <td>{{ row.location }}</td>
            <td>{{ row.usage_date }}</td>
            <td>{{ row.liters_used }}</td>
            <td>{{ row.purpose }}</td>

            <td>

                <a href="/edit/{{ row.id }}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="/delete/{{ row.id }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this record?')">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/" class="btn btn-secondary">
        Home
    </a>

</div>

</body>
</html>
